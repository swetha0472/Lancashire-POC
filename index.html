<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lancashire POC</title>
    
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #0070d2; text-align: center; }
        #lwcLightning { background: white; }
        .error { color: red; text-align: center; padding: 40px; background: #ffe6e6; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lancashire Future Students Portal</h1>
        <div id="lwcLightning">
            <div style="text-align:center; padding:100px 20px; color:#666;"></div>
        </div>
    </div>

    <script>
        async function initLightningOut() {
            try {
                console.log("Fetching config from Salesforce...");

                const res = await fetch('https://creationtechnology4.my.site.com/services/apexrest/lo/config', {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!res.ok) {
                    throw new Error(`HTTP Error: ${res.status}`);
                }

                const config = await res.json();
                console.log("✅ Config Loaded:", config);

                // Load Lightning Out script
                const script = document.createElement('script');
                script.src = config.fullSiteUrl + '/lightning/lightning.out.js';
                script.async = true;
                document.head.appendChild(script);

                script.onload = () => {
                    $Lightning.use(
                        config.dependencyApp,
                        function() {
                            $Lightning.createComponent(
                                config.componentName,
                                { flowName: config.flowName },
                                "lwcLightning",
                                function() {
                                    console.log("✅ LWC Loaded Successfully!");
                                }
                            );
                        },
                        config.fullSiteUrl
                    );
                };

            } catch (error) {
                console.error("Error:", error);
                document.getElementById('lwcLightning').innerHTML = 
                    `<p class="error">
                        <strong>Error loading from GitHub Pages:</strong><br><br>
                        ${error.message}<br><br>
                        Please check:<br>
                        1. CORS settings in Salesforce<br>
                        2. Browser Console (F12) for more details
                    </p>`;
            }
        }

        initLightningOut();
    </script>
</body>
</html>
