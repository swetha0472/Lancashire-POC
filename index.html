<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lancashire POC - Lightning Out</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #0070d2; text-align: center; }
        #lwcLightning { background-color: white; }
        .loading { text-align: center; padding: 80px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lancashire Future Students Portal</h1>
        <div id="lwcLightning">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <script>
        // The only "hardcoded" thing — your own site's config endpoint
        const CONFIG_URL = 'https://lancashiredev--dev.sandbox.my.site.com/services/apexrest/lo/config';

        async function loadLightningOut() {
            try {
                // 1. Fetch all values from Custom Labels via Apex REST
                const response = await fetch(CONFIG_URL);
                if (!response.ok) throw new Error('Config fetch failed: ' + response.status);
                const config = await response.json();

                // config = {
                //   fullSiteUrl:   "https://lancashiredev--dev.sandbox.my.site.com/futurestudents"
                //   dependencyApp: "c:LightningOutFlowEmbed"
                //   flowName:      "EnquiryFormDemo"
                // }

                // 2. Dynamically load lightning.out.js using the URL from Custom Label
                const script = document.createElement('script');
                script.src = config.fullSiteUrl + '/lightning/lightning.out.js';
                document.head.appendChild(script);

                script.onload = function() {
                    // 3. Use values from Custom Labels — nothing hardcoded
                    $Lightning.use(
                        config.dependencyApp,
                        function() {
                            $Lightning.createComponent(
                                "lightning:flow",
                                {},
                                "lwcLightning",
                                function(component) {
                                    console.log("✅ Flow loaded:", config.flowName);
                                    component.startFlow(config.flowName);
                                }
                            );
                        },
                        config.fullSiteUrl
                    );
                };

                script.onerror = function() {
                    showError('Failed to load Lightning Out JS. Check Site URL in Custom Labels.');
                };

            } catch (err) {
                console.error(err);
                showError('Could not load config. ' + err.message);
            }
        }

        function showError(msg) {
            document.getElementById('lwcLightning').innerHTML =
                '<p style="color:red; text-align:center; padding:40px;">' + msg + '</p>';
        }

        document.addEventListener('DOMContentLoaded', loadLightningOut);
    </script>
</body>
</html>
