<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lancashire POC</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #0070d2; text-align: center; }
        #lwcLightning { background: white; min-height: 700px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lancashire Future Students Portal</h1>
        <button onclick="startLogin()" style="padding:12px 24px; font-size:16px;">Login to Salesforce</button>
        <div id="lwcLightning" style="margin-top:20px;"></div>
    </div>

    <script>
        async function startLogin() {
            const clientId = '3MVG9GBhY6wQjl2uGwI77CbrWiaXHSIsEfJdRW0K8NKqXokcR5317cnVsmmOqOtmE.3LloloZuMqLmDUY9Ms0';
            const redirectUri = 'https://your-vercel-app.vercel.app/api/frontdoor'; // Change this
            const loginUrl = 'https://creationtechnology4.my.salesforce.com';

            const authUrl = `${loginUrl}/services/oauth2/authorize?` +
                `response_type=code&client_id=${clientId}&redirect_uri=${encodeURIComponent(redirectUri)}` +
                `&scope=api+web+lightning`;

            window.location.href = authUrl;
        }

        async function handleCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (code) {
                const response = await fetch(`/api/frontdoor?code=${code}`);
                const data = await response.json();

                if (data.frontdoorUrl) {
                    initializeLightningOut(data.frontdoorUrl);
                }
            }
        }

        function initializeLightningOut(frontdoorUrl) {
            const container = document.getElementById('lwcLightning');

            const loApp = document.createElement('lightning-out-application');
            loApp.setAttribute('app-id', '1UsdN00000025bVSAQ');           // Your App ID
            loApp.setAttribute('components', 'c-learning-program-flow-embed');
            loApp.setAttribute('frontdoor-url', frontdoorUrl);

            container.appendChild(loApp);
        }

        // Check for callback
        if (window.location.search.includes('code=')) {
            handleCallback();
        }
    </script>
</body>
</html>
