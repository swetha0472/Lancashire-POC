<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lancashire POC - Lightning Out</title>
    
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #0070d2; text-align: center; }
        #lwcLightning { background: white; min-height: 700px; border-radius: 8px; padding: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lancashire Future Students Portal</h1>
        <div id="lwcLightning">
            <div style="text-align:center; padding:80px;">Loading Flow...</div>
        </div>
    </div>

    <script>
        async function loadLightningOut() {
            try {
                const response = await fetch('https://creationtechnology4.my.site.com/services/apexrest/lo/config');
                const config = await response.json();

                const script = document.createElement('script');
                script.src = config.fullSiteUrl + '/lightning/lightning.out.js';
                script.async = true;
                document.head.appendChild(script);

                script.onload = () => {
                    $Lightning.use(
                        config.dependencyApp,
                        function() {
                            $Lightning.createComponent(
                                config.componentName,
                                { flowName: config.flowName },
                                "lwcLightning",
                                function() {
                                    console.log("✅ LWC Loaded Successfully");
                                }
                            );
                        },
                        config.fullSiteUrl
                    );
                };
            } catch (err) {
                console.error(err);
                document.getElementById('lwcLightning').innerHTML = 
                    '<p style="color:red; text-align:center;">CORS or Config Error. Check Salesforce settings.</p>';
            }
        }

        loadLightningOut();
    </script>
</body>
</html>
